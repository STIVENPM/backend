spring.application.name=backend-vehicular
server.port=8081

# Copia las propiedades sensibles a application-local.properties para desarrollo.
spring.datasource.url=jdbc:postgresql://localhost:5432/LavaRapido_Vehicular
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
logging.level.org.springframework.security=TRACE

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend.url=http://localhost:5173

# Wompi Widget: definir estos valores en application-local.properties o variables de entorno.
wompi.environment=${WOMPI_ENVIRONMENT:sandbox}
wompi.public-key=${WOMPI_PUBLIC_KEY}
wompi.private-key=${WOMPI_PRIVATE_KEY}
wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET}
wompi.events-secret=${WOMPI_EVENTS_SECRET}
