spring.application.name=backend-vehicular
server.port=8081

# Archivo local opcional, ignorado por Git, para credenciales de desarrollo.
spring.config.import=optional:file:./application-local.properties,optional:file:./application-wompi-local.properties

# Base PostgreSQL administrada por Liquibase en el repositorio lavarapido-base-datos.
# Para ejecutar Java en el host, Docker publica PostgreSQL en localhost:5433.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:lavarapido_db}
spring.datasource.username=${DB_USERNAME:lavarapido_user}
spring.datasource.password=${DB_PASSWORD:lavarapido_password}

# driver especifico para postgresql
spring.datasource.driver-class-name=org.postgresql.Driver

# --- hibernate jpa ---
# Liquibase crea las tablas; Hibernate solo comprueba el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# dialecto correcto para hablar el lenguaje de postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# llave secreta para firmar los tokens jwt - debe tener al menos 32 caracteres para el algoritmo hs256
jwt.secret=${JWT_SECRET:}

logging.level.org.springframework.security=TRACE

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL del frontend para armar el enlace en el correoo
app.frontend.url=http://localhost:5173

# Wompi Widget. La llave privada se usa solo para reconciliar transacciones por ID desde backend.
# Los prefijos de todas las llaves deben corresponder a WOMPI_ENVIRONMENT.
wompi.environment=${WOMPI_ENVIRONMENT:sandbox}
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.private-key=${WOMPI_PRIVATE_KEY:}
wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
wompi.events-secret=${WOMPI_EVENTS_SECRET:}
